<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
    <title>Speaky をセットアップ中</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Helvetica,
          Arial,
          sans-serif;
        background: linear-gradient(135deg, #6ee7b7 0%, #93c5fd 50%, #c4b5fd 100%);
        color: #0f172a;
        -webkit-app-region: drag;
        user-select: none;
        -webkit-user-select: none;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: linear-gradient(135deg, #064e3b 0%, #1e3a8a 50%, #4c1d95 100%);
          color: #f8fafc;
        }
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 32px;
        box-sizing: border-box;
        text-align: center;
      }

      .title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
        letter-spacing: 0.01em;
      }

      .subtitle {
        font-size: 13px;
        line-height: 1.5;
        opacity: 0.85;
        margin: 0 0 28px;
        max-width: 360px;
      }

      .progress {
        width: 320px;
        height: 6px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.15);
        overflow: hidden;
        position: relative;
      }

      @media (prefers-color-scheme: dark) {
        .progress {
          background: rgba(248, 250, 252, 0.18);
        }
      }

      .progress__bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 35%;
        border-radius: 999px;
        background: linear-gradient(90deg, #10b981, #6366f1);
        animation: indeterminate 1.4s ease-in-out infinite;
      }

      @keyframes indeterminate {
        0% {
          left: -35%;
        }
        100% {
          left: 100%;
        }
      }

      .status {
        margin-top: 18px;
        font-size: 12px;
        opacity: 0.7;
        min-height: 16px;
      }

      .error {
        margin-top: 18px;
        font-size: 12px;
        color: #b91c1c;
        max-width: 360px;
        word-break: break-word;
        white-space: pre-wrap;
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        .error {
          color: #fecaca;
        }
      }

      .error--visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Speaky をセットアップしています</h1>
      <p class="subtitle">
        初回起動時のみ、同梱モデルを書き込みます(30〜60 秒)。<br />
        そのままお待ちください。
      </p>
      <div class="progress" aria-label="セットアップ進捗">
        <div class="progress__bar"></div>
      </div>
      <p class="status" id="status">モデルファイルを展開中…</p>
      <p class="error" id="error"></p>
    </div>
  </body>
</html>
